<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EthOS Download Manager</title>
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 16px 0;
      color: #111;
    }
    .section {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 500;
      color: #333;
    }
    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 13px;
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    button {
      background: #10b981;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    button:hover {
      background: #059669;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #6b7280;
    }
    .btn-secondary:hover {
      background: #4b5563;
    }
    .status {
      padding: 8px 12px;
      border-radius: 4px;
      margin-top: 12px;
      display: none;
      font-size: 13px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .checkbox-row input[type="checkbox"] {
      width: auto;
    }
    .help-text {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>⬇️ EthOS Download Manager</h1>

  <div class="section">
    <label for="server">EthOS Server URL</label>
    <input type="text" id="server" placeholder="http://ethos.local" />
    <div class="help-text">Example: http://192.168.1.100 or http://nas.local</div>
  </div>

  <div class="section">
    <label for="token">API Token</label>
    <input type="password" id="token" placeholder="Enter API token" />
    <div class="help-text">Generate token in EthOS: Download Manager → Settings → Browser Extension</div>
  </div>

  <div class="section">
    <div class="checkbox-row">
      <input type="checkbox" id="useDebrid" checked />
      <label for="useDebrid" style="margin: 0;">Use Debrid service (if configured)</label>
    </div>
  </div>

  <div class="button-row">
    <button id="saveBtn">Save Settings</button>
    <button id="testBtn" class="btn-secondary">Test Connection</button>
  </div>

  <div id="status" class="status"></div>

  <hr style="margin: 20px 0; border: none; border-top: 1px solid #e5e7eb;" />

  <div class="section">
    <label for="urlInput">Add Download</label>
    <textarea id="urlInput" placeholder="Paste URL(s) here, one per line..."></textarea>
    <button id="addBtn" style="margin-top: 8px; width: 100%;">Add to Downloads</button>
  </div>

  <div id="downloadStatus" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
