# EthOS Power Optimization - Disable unused peripherals
# Generated by EthOS Builder

# Disable Bluetooth
blacklist bluetooth
blacklist btusb
install bluetooth /bin/true
install btusb /bin/true

# Disable Audio
blacklist snd_hda_intel
blacklist snd_sof_pci_intel_tgl
blacklist snd_sof_intel_hda_common
blacklist snd_soc_avs
blacklist snd_usb_audio
install snd_hda_intel /bin/true
install snd_sof_pci_intel_tgl /bin/true
install snd_sof_intel_hda_common /bin/true
install snd_soc_avs /bin/true
install snd_usb_audio /bin/true
