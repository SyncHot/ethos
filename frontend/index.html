<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthOS</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/apps.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/i18n.js?v=2"></script>
</head>
<body>
    <!-- ═══════ Setup Wizard (first boot) ═══════ -->
    <div id="setup-wizard" class="login-screen hidden">
        <div class="login-bg"></div>
        <div id="setup-content"></div>
    </div>

    <!-- ═══════ Login Screen ═══════ -->
    <div id="login-screen" class="login-screen">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class="fas fa-server"></i>
                </div>
            </div>
            <h1 class="login-hostname" id="login-hostname">EthOS</h1>
            <p class="login-motto">Your Desktop, Anywhere</p>
            <p class="login-subtitle">Network Attached Storage</p>
            <form id="login-form" autocomplete="off">
                <div class="form-group">
                    <div class="input-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="login-username" placeholder="Użytkownik (puste = admin)" data-i18n-placeholder="Użytkownik (puste = admin)" autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Hasło" data-i18n-placeholder="Hasło" autofocus>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <span data-i18n="Zaloguj się">Zaloguj się</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <p class="login-error" id="login-error"></p>
            </form>
        </div>
        <div class="login-footer">
            <span id="login-time"></span>
        </div>
    </div>

    <!-- ═══════ Desktop ═══════ -->
    <div id="desktop" class="desktop hidden">
        <!-- Taskbar (top) -->
        <header class="taskbar" id="taskbar">
            <div class="taskbar-left">
                <button class="taskbar-btn menu-btn" id="main-menu-btn" title="Menu główne" data-i18n-title="Menu główne">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" fill="currentColor"/>
                        <rect x="13" y="3" width="8" height="8" rx="1.5" fill="currentColor"/>
                        <rect x="3" y="13" width="8" height="8" rx="1.5" fill="currentColor"/>
                        <rect x="13" y="13" width="8" height="8" rx="1.5" fill="currentColor"/>
                    </svg>
                </button>
                <div class="taskbar-separator"></div>
                <div class="taskbar-windows" id="taskbar-windows"></div>
            </div>
            <div class="taskbar-right">
                <div class="taskbar-stats" id="taskbar-stats">
                    <div class="mini-stat" id="stat-cpu" title="CPU">
                        <i class="fas fa-microchip"></i>
                        <span>0%</span>
                    </div>
                    <div class="mini-stat" id="stat-ram" title="RAM">
                        <i class="fas fa-memory"></i>
                        <span>0%</span>
                    </div>
                    <div class="mini-stat" id="stat-net" title="Sieć" data-i18n-title="Sieć">
                        <i class="fas fa-network-wired"></i>
                        <span>0 B/s</span>
                    </div>
                </div>
                <div class="taskbar-separator"></div>
                <button class="taskbar-btn" id="notifications-btn" title="Powiadomienia" data-i18n-title="Powiadomienia">
                    <i class="fas fa-bell"></i>
                    <span class="notif-badge hidden" id="notif-badge">0</span>
                </button>
                <div class="taskbar-separator"></div>
                <div class="taskbar-clock" id="taskbar-clock"></div>
                <button class="taskbar-btn power-btn" id="power-btn" title="Power Manager">
                    <i class="fas fa-power-off"></i>
                </button>
                <button class="taskbar-btn user-btn" id="user-btn" title="Użytkownik">
                    <i class="fas fa-user-circle"></i>
                </button>
            </div>
        </header>

        <!-- Desktop Area -->
        <div class="desktop-area" id="desktop-area">
            <div class="desktop-icons" id="desktop-icons"></div>
            <div class="window-layer" id="window-layer"></div>
        </div>

        <!-- ═══ Overlays ═══ -->

        <!-- Main Menu -->
        <div class="overlay main-menu hidden" id="main-menu">
            <div class="main-menu-backdrop"></div>
            <div class="main-menu-panel">
                <div class="mm-header">
                    <input type="text" id="mm-search" class="mm-search" placeholder="Szukaj aplikacji..." data-i18n-placeholder="Szukaj aplikacji...">
                </div>
                <div class="mm-grid" id="mm-grid"></div>
            </div>
        </div>

        <!-- Notification Panel -->
        <div class="notif-panel hidden" id="notif-panel">
            <div class="notif-header">
                <h3 data-i18n="Powiadomienia">Powiadomienia</h3>
                <button class="notif-clear" id="notif-clear" data-i18n="Wyczyść">Wyczyść</button>
            </div>
            <div class="notif-list" id="notif-list">
                <p class="notif-empty" data-i18n="Brak powiadomień">Brak powiadomień</p>
            </div>
        </div>

        <!-- Power Menu -->
        <div class="power-menu hidden" id="power-menu">
            <div class="pm-header">
                <i class="fas fa-power-off"></i>
                <span>Power Manager</span>
            </div>
            <div class="pm-uptime" id="pm-uptime" data-i18n="Ładowanie...">Ładowanie...</div>
            <div class="um-divider"></div>
            <button class="um-item pm-action" data-action="restart-app">
                <i class="fas fa-sync-alt" style="color:#22c55e"></i> <span data-i18n="Restart aplikacji">Restart aplikacji</span>
            </button>
            <button class="um-item pm-action" data-action="reboot">
                <i class="fas fa-redo" style="color:#f59e0b"></i> <span data-i18n="Restart systemu">Restart systemu</span>
            </button>
            <button class="um-item pm-action" data-action="shutdown">
                <i class="fas fa-power-off" style="color:#ef4444"></i> <span data-i18n="Wyłącz system">Wyłącz system</span>
            </button>
        </div>

        <!-- User Menu -->
        <div class="user-menu hidden" id="user-menu">
            <div class="um-header">
                <i class="fas fa-user-circle"></i>
                <span id="um-username">Administrator</span>
            </div>
            <div class="um-divider"></div>
            <button class="um-item" id="btn-about">
                <i class="fas fa-info-circle"></i> <span data-i18n="O systemie">O systemie</span>
            </button>
            <button class="um-item" id="btn-logout">
                <i class="fas fa-sign-out-alt"></i> <span data-i18n="Wyloguj się">Wyloguj się</span>
            </button>
        </div>

        <!-- Toast container -->
        <div class="toast-container" id="toast-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
    <script src="js/installer.js?v=1"></script>
    <script src="js/setup.js?v=2"></script>
    <script src="js/desktop.js?v=5"></script>
    <script src="js/apps.js?v=5"></script>
    <script src="js/apps/storage.js?v=3"></script>
    <script src="js/apps/sharing.js?v=1"></script>
    <script src="js/apps/printer.js?v=3"></script>
    <script src="js/apps/resources.js?v=2"></script>
    <script src="js/apps/backup.js?v=3"></script>
    <script src="js/apps/terminal.js?v=2"></script>
    <script src="js/apps/packages.js?v=3"></script>
    <script src="js/apps/users.js?v=2"></script>
    <script src="js/apps/network.js?v=1"></script>
    <script src="js/apps/duplicates.js?v=1"></script>
    <script src="js/apps/gallery.js?v=2"></script>
    <script src="js/apps/editor.js?v=1"></script>
    <script src="js/apps/code_editor.js?v=2"></script>
    <script src="js/apps/downloads.js?v=1"></script>
    <script src="js/apps/flasher.js?v=2"></script>
    <script src="js/apps/builder.js?v=2"></script>
    <script src="js/apps/updates.js?v=2"></script>
    <script src="js/apps/services.js?v=1"></script>
    <script src="js/apps/diskrepair.js?v=1"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script src="js/apps/surveillance.js?v=1"></script>
    <script src="js/apps/aichat.js?v=2"></script>
    <script src="js/apps/websites.js?v=2"></script>
    <script src="js/apps/naslink.js?v=1"></script>
    <script src="js/apps/ssh.js?v=1"></script>
    <script src="js/apps/domains.js?v=3"></script>
    <script src="js/apps/stickynotes.js?v=2"></script>
    <script src="js/apps/familyhub.js?v=1"></script>
</body>
</html>
